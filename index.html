<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="referrer" content="no-referrer">
    <title>Auto Ad Viewer App</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        .page {
            display: none;
            flex: 1;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
        }
        .active {
            display: flex;
        }

        h2 {
            color: #333;
            margin-bottom: 20px;
        }
        
        p.info-text {
            color: #666;
            font-size: 14px;
            margin-bottom: 30px;
            max-width: 300px;
        }
        
        button {
            padding: 15px 30px;
            margin: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            border-radius: 10px;
            color: white;
            width: 100%;
            max-width: 300px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: 0.3s;
        }
        
        button:active {
            transform: scale(0.95);
        }

        .btn-monetag { background-color: #2ed573; }
        .btn-adsterra { background-color: #ff4757; }
        .btn-hilltopads { background-color: #e67e22; }
        .btn-back { background-color: #747d8c; }
        .btn-save { background-color: #007bff; }

        input {
            padding: 15px;
            width: 100%;
            max-width: 300px;
            margin-bottom: 20px;
            border: 2px solid #ccc;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
            box-sizing: border-box;
        }
        
        input:focus {
            border-color: #007bff;
        }

        /* --- Fullscreen Ad Viewer (Iframe) --- */
        #ad-viewer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #fff;
            z-index: 1000;
            display: none;
        }
        #ad-viewer.active {
            display: block;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #fff;
        }

        /* --- Perfect Floating Stop Button --- */
        .floating-stop-btn {
            position: absolute;
            bottom: 30px; /* স্ক্রিনের নিচে থাকবে */
            left: 50%;
            transform: translateX(-50%);
            background-color: #ff3f34;
            color: white;
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            border: 2px solid white;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
            z-index: 9999; /* সবার উপরে থাকবে */
            width: auto;
            max-width: 250px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 63, 52, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(255, 63, 52, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 63, 52, 0); }
        }
    </style>
</head>
<body>

    <!-- 1. Main Menu Page -->
    <div id="main-menu" class="page active">
        <h2>Auto Ad Network Menu</h2>
        <p class="info-text">Select a network. Ads will run inside the app (15s Ad ➔ Menu ➔ 1s Wait ➔ Repeat).</p>
        <button id="btn-monetag" class="btn-monetag" onclick="handleNetwork('MoneTag')">MoneTag</button>
        <button id="btn-adsterra" class="btn-adsterra" onclick="handleNetwork('Adsterra')">Adsterra</button>
        <button id="btn-hilltopads" class="btn-hilltopads" onclick="handleNetwork('HilltopAds')">HilltopAds</button>
        
        <!-- Main menu stop button (Hidden by default) -->
        <button id="menu-stop-btn" class="floating-stop-btn" style="display: none; position: relative; bottom: 0; margin-top: 30px;" onclick="stopAutoAds()">🛑 Stop Loop</button>
    </div>

    <!-- 2. Setup Page -->
    <div id="setup-page" class="page">
        <h2 id="setup-title">Setup</h2>
        <p class="info-text" id="setup-desc">Paste your advertiser direct link below.</p>
        <input type="url" id="ad-input" placeholder="https://example.com/direct-link" required>
        <button class="btn-save" onclick="saveAndShowAd()">Save & Start Auto Ads</button>
        <button class="btn-back" onclick="showPage('main-menu')">Back to Menu</button>
    </div>

    <!-- 3. Ad Viewer (Fullscreen Iframe with Floating Stop Button) -->
    <div id="ad-viewer">
        <button class="floating-stop-btn" onclick="stopAutoAds()">🛑 Stop Auto Ads</button>
        <iframe id="ad-frame" sandbox="allow-scripts allow-same-origin allow-popups allow-forms" src=""></iframe>
    </div>

    <script>
        let currentNetwork = ''; 
        let isLoopRunning = false; 
        let viewTimer; 
        let restartTimer; 

        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
            document.getElementById('ad-viewer').classList.remove('active');

            if (pageId === 'ad-viewer') {
                document.getElementById('ad-viewer').classList.add('active');
            } else {
                document.getElementById(pageId).classList.add('active');
            }
        }

        function handleNetwork(networkName) {
            currentNetwork = networkName;
            const savedData = localStorage.getItem(networkName + '_link');

            if (savedData) {
                isLoopRunning = true;
                document.getElementById('menu-stop-btn').style.display = 'block'; // মেইন মেনুতেও স্টপ বাটন শো করবে
                executeAdCycle(savedData);
            } else {
                document.getElementById('setup-title').innerText = networkName + " Setup";
                document.getElementById('ad-input').value = "";
                showPage('setup-page');
            }
        }

        function saveAndShowAd() {
            const inputValue = document.getElementById('ad-input').value.trim();
            
            if (inputValue === "" || !inputValue.startsWith("http")) {
                alert("Please enter a valid link starting with http:// or https://");
                return;
            }

            localStorage.setItem(currentNetwork + '_link', inputValue);
            isLoopRunning = true;
            document.getElementById('menu-stop-btn').style.display = 'block';
            executeAdCycle(inputValue);
        }

        // মূল অটো-বট লজিক ফাংশন
        function executeAdCycle(url) {
            if (!isLoopRunning) return; 

            // ১. বাটনে ক্লিক হওয়ার একটি ভিজ্যুয়াল ইফেক্ট দেওয়া
            const btnId = 'btn-' + currentNetwork.toLowerCase();
            const btnElement = document.getElementById(btnId);
            if (btnElement) {
                btnElement.style.opacity = '0.5';
                setTimeout(() => { btnElement.style.opacity = '1'; }, 300);
            }

            // ২. লিংকের শেষে টাইমস্ট্যাম্প যোগ করে অ্যাড লোড করা (Cache Bypass)
            const cacheBusterUrl = url + (url.includes('?') ? '&' : '?') + 'cb=' + new Date().getTime();
            document.getElementById('ad-frame').src = cacheBusterUrl;
            showPage('ad-viewer');

            // ৩. ঠিক ১৫ সেকেন্ড অ্যাড চলবে (15000 milliseconds)
            viewTimer = setTimeout(() => {
                if (!isLoopRunning) return; 

                // ১৫ সেকেন্ড পর অ্যাড ক্লোজ করে মেইন মেনুতে ফেরত আসবে
                document.getElementById('ad-frame').src = "about:blank"; 
                showPage('main-menu');

                // ৪. মেইন মেনুতে ঠিক ১ সেকেন্ড (1000 milliseconds) অপেক্ষা করে আবার সাইকেল শুরু হবে
                restartTimer = setTimeout(() => {
                    if (isLoopRunning) {
                        executeAdCycle(url); // নিজে নিজেই আবার ক্লিক করে লুপ চালাবে
                    }
                }, 1000);

            }, 15000); // 15 Seconds Timer
        }

        function stopAutoAds() {
            isLoopRunning = false; 
            clearTimeout(viewTimer); 
            clearTimeout(restartTimer); 
            
            document.getElementById('ad-frame').src = "about:blank"; 
            document.getElementById('menu-stop-btn').style.display = 'none'; // মেইন মেনুর স্টপ বাটন হাইড করা
            showPage('main-menu'); 
        }
    </script>
</body>
</html>
