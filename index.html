<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ad Viewer App</title>
    <style>
        /* Basic Styling */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Page Transitions */
        .page {
            display: none;
            flex: 1;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
        }
        .active {
            display: flex;
        }

        /* Text and Button Design */
        h2 {
            color: #333;
            margin-bottom: 20px;
        }
        
        p.info-text {
            color: #666;
            font-size: 14px;
            margin-bottom: 30px;
            max-width: 300px;
        }
        
        button {
            padding: 15px 30px;
            margin: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            border-radius: 10px;
            color: white;
            width: 100%;
            max-width: 300px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: 0.3s;
        }
        
        button:active {
            transform: scale(0.98);
        }

        /* Network Button Colors */
        .btn-monetag { background-color: #2ed573; }
        .btn-adsterra { background-color: #ff4757; }
        .btn-hilltopads { background-color: #e67e22; } /* HilltopAds Button Color (Orange) */
        
        .btn-back { background-color: #747d8c; }
        .btn-save { background-color: #007bff; }

        input {
            padding: 15px;
            width: 100%;
            max-width: 300px;
            margin-bottom: 20px;
            border: 2px solid #ccc;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
            box-sizing: border-box;
        }
        
        input:focus {
            border-color: #007bff;
        }
    </style>
</head>
<body>

    <!-- 1. Main Menu Page -->
    <div id="main-menu" class="page active">
        <h2>Ad Network Menu</h2>
        <p class="info-text">Click on any network below to view ads. Press your phone's Back button when you are done to return here.</p>
        <button class="btn-monetag" onclick="handleNetwork('MoneTag')">MoneTag</button>
        <button class="btn-adsterra" onclick="handleNetwork('Adsterra')">Adsterra</button>
        <button class="btn-hilltopads" onclick="handleNetwork('HilltopAds')">HilltopAds</button>
    </div>

    <!-- 2. Setup Page (Dynamic for URL) -->
    <div id="setup-page" class="page">
        <h2 id="setup-title">Setup</h2>
        <p class="info-text" id="setup-desc">Paste your advertiser direct link below. You only need to save this once.</p>
        <input type="url" id="ad-input" placeholder="https://example.com/direct-link" required>
        <button class="btn-save" onclick="saveAndShowAd()">Save & Show Ad</button>
        <button class="btn-back" onclick="showPage('main-menu')">Back to Menu</button>
    </div>

    <script>
        let currentNetwork = ''; 

        // Switch Pages
        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
        }

        // Handle Network Clicks
        function handleNetwork(networkName) {
            currentNetwork = networkName;
            
            // Check local storage for a saved link
            const savedData = localStorage.getItem(networkName + '_link');

            if (savedData) {
                // If saved data exists, open the ad directly
                openAd(savedData);
            } else {
                // Setup UI for Link Input
                document.getElementById('setup-title').innerText = networkName + " Setup";
                
                const inputField = document.getElementById('ad-input');
                inputField.value = "";
                
                showPage('setup-page');
            }
        }

        // Save Input and Show Ad
        function saveAndShowAd() {
            const inputValue = document.getElementById('ad-input').value.trim();
            
            // Validate URL (Must contain http:// or https://)
            if(inputValue === "" || !inputValue.startsWith("http")) {
                alert("Please enter a valid link starting with http:// or https://");
                return;
            }

            // Save Data permanently based on network name
            localStorage.setItem(currentNetwork + '_link', inputValue);
            
            // Go back to main menu, then open ad
            showPage('main-menu');
            openAd(inputValue);
        }

        // Open Link Ads (Adsterra, MoneTag, HilltopAds)
        function openAd(url) {
            // Opens the link in a new tab or the app's native browser view.
            // The user can press the device's Back button to return to the menu.
            window.open(url, '_blank');
        }
    </script>
</body>
</html>
