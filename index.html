<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ad Viewer App</title>
    <style>
        /* Basic Styling */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Page Transitions */
        .page {
            display: none;
            flex: 1;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
        }
        .active {
            display: flex;
        }

        /* Text and Button Design */
        h2 {
            color: #333;
            margin-bottom: 20px;
        }
        
        p.info-text {
            color: #666;
            font-size: 14px;
            margin-bottom: 30px;
            max-width: 300px;
        }
        
        button {
            padding: 15px 30px;
            margin: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            border-radius: 10px;
            color: white;
            width: 100%;
            max-width: 300px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: 0.3s;
        }
        
        button:active {
            transform: scale(0.98);
        }

        .btn-adsterra { background-color: #ff4757; }
        .btn-monetag { background-color: #2ed573; }
        .btn-startio { background-color: #8e44ad; } /* New Start.io Button Color */
        .btn-back { background-color: #747d8c; }
        .btn-save { background-color: #007bff; }

        input {
            padding: 15px;
            width: 100%;
            max-width: 300px;
            margin-bottom: 20px;
            border: 2px solid #ccc;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
            box-sizing: border-box;
        }
        
        input:focus {
            border-color: #007bff;
        }

        /* Start.io Ad Viewer (Full Screen Overlay) */
        #startio-viewer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #ffffff;
            z-index: 1000;
            display: none; /* Hidden by default */
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        #startio-viewer.active {
            display: flex;
        }

        /* Close Button (×) for Start.io */
        .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 28px;
            color: white;
            background: #ff4757;
            cursor: pointer;
            font-weight: bold;
            z-index: 1001;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            text-align: center;
            line-height: 45px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        /* Placeholder for Start.io Ad Content */
        .ad-content {
            border: 2px dashed #8e44ad;
            padding: 40px;
            border-radius: 10px;
            color: #333;
        }
    </style>
</head>
<body>

    <!-- 1. Main Menu Page -->
    <div id="main-menu" class="page active">
        <h2>Ad Network Menu</h2>
        <p class="info-text">Select a network to view ads.</p>
        <button class="btn-monetag" onclick="handleNetwork('MoneTag')">MoneTag</button>
        <button class="btn-adsterra" onclick="handleNetwork('Adsterra')">Adsterra</button>
        <button class="btn-startio" onclick="handleNetwork('Start.io')">Start.io</button> <!-- New Option -->
    </div>

    <!-- 2. Setup Page (Shows only the first time) -->
    <div id="setup-page" class="page">
        <h2 id="setup-title">Setup</h2>
        <p class="info-text" id="setup-desc">Provide the required details below.</p>
        <!-- Input field dynamically changes based on network -->
        <input type="text" id="ad-input" required>
        <button class="btn-save" onclick="saveAndShowAd()">Save & Show Ad</button>
        <button class="btn-back" onclick="showPage('main-menu')">Back to Menu</button>
    </div>

    <!-- 3. Start.io Ad Viewer Page (With Cross Button) -->
    <div id="startio-viewer">
        <div class="close-btn" onclick="closeStartIoAd()">×</div>
        <div class="ad-content">
            <h3>Start.io Ad Running</h3>
            <p>App ID: <strong id="display-app-id"></strong></p>
            <p style="font-size: 12px; color: #777;">(Your Start.io Ads will be displayed here)</p>
        </div>
    </div>

    <script>
        let currentNetwork = ''; // Stores the currently clicked network

        // Function to switch between main pages
        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
        }

        // Function to handle network button clicks
        function handleNetwork(networkName) {
            currentNetwork = networkName;
            
            // Check local storage for saved data
            const savedData = localStorage.getItem(networkName + '_data');

            if (savedData) {
                // If data is saved, show the ad directly
                showAd(currentNetwork, savedData);
            } else {
                // If not saved, prepare the setup page
                document.getElementById('setup-title').innerText = networkName + " Setup";
                const inputField = document.getElementById('ad-input');
                const descText = document.getElementById('setup-desc');

                if (networkName === 'Start.io') {
                    // Setup for Start.io App ID
                    inputField.type = "text";
                    inputField.placeholder = "Enter Start.io App ID (e.g., 205465545)";
                    descText.innerText = "Paste your Start.io App ID below. You only need to save this once.";
                } else {
                    // Setup for Direct Links (Adsterra/MoneTag)
                    inputField.type = "url";
                    inputField.placeholder = "https://example.com/direct-link";
                    descText.innerText = "Paste your advertiser direct link below. You only need to save this once.";
                }
                
                inputField.value = "";
                showPage('setup-page');
            }
        }

        // Function to save the input and show the ad
        function saveAndShowAd() {
            const inputVal = document.getElementById('ad-input').value.trim();
            
            if(inputVal === "") {
                alert("Please enter a valid Link or App ID.");
                return;
            }

            // URL Validation for Adsterra and MoneTag
            if (currentNetwork !== 'Start.io' && !inputVal.startsWith("http")) {
                alert("Please enter a valid link starting with http:// or https://");
                return;
            }

            // Permanently save the data in local storage
            localStorage.setItem(currentNetwork + '_data', inputVal);
            
            // Go back to the main menu first, then show the ad
            showPage('main-menu');
            showAd(currentNetwork, inputVal);
        }

        // Function to trigger the Ad
        function showAd(network, data) {
            if (network === 'Start.io') {
                // Open full-screen Start.io Viewer with Cross Button
                document.getElementById('display-app-id').innerText = data;
                document.getElementById('startio-viewer').classList.add('active');
            } else {
                // Open direct link for Adsterra/MoneTag
                window.open(data, '_blank');
            }
        }

        // Function to close Start.io Ad using the cross (×) button
        function closeStartIoAd() {
            document.getElementById('startio-viewer').classList.remove('active');
        }
    </script>
</body>
</html>
