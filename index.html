<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ad Viewer App</title>
    <style>
        /* Basic Styling */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Page Transitions */
        .page {
            display: none;
            flex: 1;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
        }
        .active {
            display: flex;
        }

        /* Text and Button Design */
        h2 {
            color: #333;
            margin-bottom: 20px;
        }
        
        p.info-text {
            color: #666;
            font-size: 14px;
            margin-bottom: 30px;
            max-width: 300px;
        }
        
        button {
            padding: 15px 30px;
            margin: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            border-radius: 10px;
            color: white;
            width: 100%;
            max-width: 300px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: 0.3s;
        }
        
        button:active {
            transform: scale(0.98);
        }

        /* Network Button Colors */
        .btn-monetag { background-color: #2ed573; }
        .btn-adsterra { background-color: #ff4757; }
        .btn-startio { background-color: #9b59b6; }
        .btn-unity { background-color: #2c3e50; } /* Unity Ads Button Color */
        
        .btn-back { background-color: #747d8c; }
        .btn-save { background-color: #007bff; }

        input {
            padding: 15px;
            width: 100%;
            max-width: 300px;
            margin-bottom: 20px;
            border: 2px solid #ccc;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
            box-sizing: border-box;
        }
        
        input:focus {
            border-color: #007bff;
        }

        /* Fullscreen Ad Containers */
        #startio-viewer, #unity-viewer {
            background-color: #000;
            color: white;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        #startio-viewer.active, #unity-viewer.active {
            display: flex;
        }

        .ad-container {
            margin-top: 20px;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>

    <!-- 1. Main Menu Page -->
    <div id="main-menu" class="page active">
        <h2>Ad Network Menu</h2>
        <p class="info-text">Click on any network below to view ads.</p>
        <button class="btn-monetag" onclick="handleNetwork('MoneTag')">MoneTag</button>
        <button class="btn-adsterra" onclick="handleNetwork('Adsterra')">Adsterra</button>
        <button class="btn-startio" onclick="handleNetwork('Start.io')">Start.io</button>
        <button class="btn-unity" onclick="handleNetwork('Unity Ads')">Unity Ads</button>
    </div>

    <!-- 2. Setup Page -->
    <div id="setup-page" class="page">
        <h2 id="setup-title">Setup</h2>
        <p class="info-text" id="setup-desc">Provide the required details below.</p>
        
        <!-- Input 1: For URL, Start.io App ID, or Unity Game ID -->
        <input type="text" id="ad-input" placeholder="Enter here..." required>
        
        <!-- Input 2: Exclusively for Unity Placement ID (Hidden by default) -->
        <input type="text" id="ad-input-2" placeholder="Enter Placement ID..." style="display: none;">

        <button class="btn-save" onclick="saveAndShowAd()">Save & Show Ad</button>
        <button class="btn-back" onclick="showPage('main-menu')">Back to Menu</button>
    </div>

    <!-- 3. Start.io Ad Viewer Page -->
    <div id="startio-viewer" class="page">
        <h3>Loading Start.io Ad...</h3>
        <p style="color: #ccc; font-size: 14px;">App ID: <span id="display-app-id"></span></p>
        <div id="startio-container" class="ad-container"></div>
    </div>

    <!-- 4. Unity Ads Viewer Page (NO Back/Cross Button) -->
    <div id="unity-viewer" class="page">
        <h3>Loading Unity Ad...</h3>
        <p style="color: #ccc; font-size: 14px;">Game ID: <span id="display-unity-gameid"></span></p>
        <p style="color: #ccc; font-size: 14px;">Placement ID: <span id="display-unity-placementid"></span></p>
        <div id="unity-container" class="ad-container">
            <p style="color: #2ed573; font-size: 14px;">Waiting for Unity Web SDK to render...</p>
        </div>
    </div>

    <script>
        let currentNetwork = ''; 

        // Switch Pages
        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
        }

        // Handle Network Clicks
        function handleNetwork(networkName) {
            currentNetwork = networkName;
            const inputField = document.getElementById('ad-input');
            const inputField2 = document.getElementById('ad-input-2');
            const descText = document.getElementById('setup-desc');

            // Hide the second input field by default
            inputField2.style.display = 'none';

            // Custom Logic for Unity Ads
            if (networkName === 'Unity Ads') {
                const savedGameId = localStorage.getItem('Unity_gameid');
                const savedPlacementId = localStorage.getItem('Unity_placementid');

                if (savedGameId && savedPlacementId) {
                    openUnityAd(savedGameId, savedPlacementId);
                    return;
                }

                document.getElementById('setup-title').innerText = "Unity Ads Setup";
                descText.innerText = "Paste your Unity Game ID and Placement ID below.";
                
                inputField.placeholder = "Enter Unity Game ID (e.g., 1234567)";
                inputField.type = "text";
                inputField.value = "";
                
                // Show second input box for Placement ID
                inputField2.placeholder = "Enter Placement ID (e.g., rewardedVideo)";
                inputField2.type = "text";
                inputField2.value = "";
                inputField2.style.display = 'block'; 

                showPage('setup-page');

            } else {
                // Logic for Start.io, Adsterra, MoneTag
                const storageKey = (networkName === 'Start.io') ? 'Start.io_appid' : networkName + '_link';
                const savedData = localStorage.getItem(storageKey);

                if (savedData) {
                    if (networkName === 'Start.io') {
                        openStartIoAd(savedData);
                    } else {
                        openAd(savedData);
                    }
                } else {
                    document.getElementById('setup-title').innerText = networkName + " Setup";

                    if (networkName === 'Start.io') {
                        descText.innerText = "Paste your Start.io App ID below.";
                        inputField.placeholder = "Enter App ID (e.g., 201234567)";
                        inputField.type = "text"; 
                    } else {
                        descText.innerText = "Paste your advertiser direct link below.";
                        inputField.placeholder = "https://example.com/direct-link";
                        inputField.type = "url";
                    }
                    
                    inputField.value = "";
                    showPage('setup-page');
                }
            }
        }

        // Save Input and Show Ad
        function saveAndShowAd() {
            const inputValue = document.getElementById('ad-input').value.trim();
            const inputValue2 = document.getElementById('ad-input-2').value.trim();
            
            if(inputValue === "") {
                alert("Please enter the required information!");
                return;
            }

            if (currentNetwork === 'Unity Ads') {
                if (inputValue2 === "") {
                    alert("Please enter the Placement ID!");
                    return;
                }
                localStorage.setItem('Unity_gameid', inputValue);
                localStorage.setItem('Unity_placementid', inputValue2);
                openUnityAd(inputValue, inputValue2);

            } else if (currentNetwork === 'Start.io') {
                localStorage.setItem('Start.io_appid', inputValue);
                openStartIoAd(inputValue);
                
            } else {
                if(!inputValue.startsWith("http")) {
                    alert("Please enter a valid link starting with http:// or https://");
                    return;
                }
                localStorage.setItem(currentNetwork + '_link', inputValue);
                showPage('main-menu');
                openAd(inputValue);
            }
        }

        // Open Link Ads (Adsterra, MoneTag)
        function openAd(url) {
            window.open(url, '_blank');
        }

        // Start.io Dynamic Script Injector
        function openStartIoAd(appId) {
            document.getElementById('display-app-id').innerText = appId;
            showPage('startio-viewer');

            const adContainer = document.getElementById('startio-container');
            adContainer.innerHTML = '';

            const configScript = document.createElement('script');
            configScript.type = 'text/javascript';
            configScript.innerHTML = `var startapp_publisher_id = "${appId}";`;

            const loaderScript = document.createElement('script');
            loaderScript.type = 'text/javascript';
            loaderScript.async = true;
            loaderScript.src = "https://w.startappservice.com/startapp.js"; 

            adContainer.appendChild(configScript);
            adContainer.appendChild(loaderScript);
        }

        // Unity Ads Screen Handler
        function openUnityAd(gameId, placementId) {
            document.getElementById('display-unity-gameid').innerText = gameId;
            document.getElementById('display-unity-placementid').innerText = placementId;
            showPage('unity-viewer');
            
            // Note: Unity Web Ads SDK or web-to-app bridge logic would go here.
            // Since Unity is mostly native (Android/iOS SDK), this sets up the layout 
            // and simulates the environment for WebView to intercept or web SDK to load.
        }
    </script>
</body>
</html>
