<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ad Viewer App</title>
    <style>
        /* Basic Styling */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Page Transitions */
        .page {
            display: none;
            flex: 1;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
        }
        .active {
            display: flex;
        }

        /* Text and Button Design */
        h2 {
            color: #333;
            margin-bottom: 20px;
        }
        
        p.info-text {
            color: #666;
            font-size: 14px;
            margin-bottom: 30px;
            max-width: 300px;
        }
        
        button {
            padding: 15px 30px;
            margin: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            border-radius: 10px;
            color: white;
            width: 100%;
            max-width: 300px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: 0.3s;
        }
        
        button:active {
            transform: scale(0.98);
        }

        .btn-adsterra { background-color: #ff4757; }
        .btn-monetag { background-color: #2ed573; }
        .btn-back { background-color: #747d8c; }
        .btn-save { background-color: #007bff; }

        input {
            padding: 15px;
            width: 100%;
            max-width: 300px;
            margin-bottom: 20px;
            border: 2px solid #ccc;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
            box-sizing: border-box;
        }
        
        input:focus {
            border-color: #007bff;
        }
    </style>
</head>
<body>

    <!-- 1. Main Menu Page -->
    <div id="main-menu" class="page active">
        <h2>Ad Network Menu</h2>
        <p class="info-text">Click on any network below to view ads. Press your phone's Back button when you are done to return here.</p>
        <button class="btn-monetag" onclick="handleNetwork('MoneTag')">MoneTag</button>
        <button class="btn-adsterra" onclick="handleNetwork('Adsterra')">Adsterra</button>
    </div>

    <!-- 2. Link Setup Page (Shows only the first time) -->
    <div id="setup-page" class="page">
        <h2 id="setup-title">Setup Link</h2>
        <p class="info-text">Paste your advertiser direct link below. You only need to save this once.</p>
        <input type="url" id="ad-link-input" placeholder="https://example.com/direct-link" required>
        <button class="btn-save" onclick="saveAndShowAd()">Save & Show Ad</button>
        <button class="btn-back" onclick="showPage('main-menu')">Back to Menu</button>
    </div>

    <script>
        let currentNetwork = ''; // Stores the currently clicked network

        // Function to switch between pages
        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
        }

        // Function to handle network button clicks
        function handleNetwork(networkName) {
            currentNetwork = networkName;
            
            // Check local storage for a saved link
            const savedLink = localStorage.getItem(networkName + '_link');

            if (savedLink) {
                // If link is saved, open the ad directly
                openAd(savedLink);
            } else {
                // If no link is saved, open the setup page
                document.getElementById('setup-title').innerText = networkName + " Setup";
                document.getElementById('ad-link-input').value = "";
                showPage('setup-page');
            }
        }

        // Function to save the link and show the ad
        function saveAndShowAd() {
            const link = document.getElementById('ad-link-input').value.trim();
            
            if(link === "" || !link.startsWith("http")) {
                alert("Please enter a valid link starting with http:// or https://");
                return;
            }

            // Permanently save the link in local storage
            localStorage.setItem(currentNetwork + '_link', link);
            
            // Go back to the main menu first, then open the ad
            showPage('main-menu');
            openAd(link);
        }

        // Function to open the direct link (using window.open)
        function openAd(url) {
            // Opens the link in a new tab or the app's native browser view.
            // The user can press the device's Back button to return to the menu.
            window.open(url, '_blank');
        }
    </script>
</body>
</html>
