<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- সিকিউরিটি বাইপাস করার জন্য রেফারার হাইড করা হলো -->
    <meta name="referrer" content="no-referrer">
    <title>Auto Ad Viewer App</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        .page {
            display: none;
            flex: 1;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
        }
        .active {
            display: flex;
        }

        h2 {
            color: #333;
            margin-bottom: 20px;
        }
        
        p.info-text {
            color: #666;
            font-size: 14px;
            margin-bottom: 30px;
            max-width: 300px;
        }
        
        button {
            padding: 15px 30px;
            margin: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            border-radius: 10px;
            color: white;
            width: 100%;
            max-width: 300px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: 0.3s;
        }
        
        button:active {
            transform: scale(0.98);
        }

        .btn-monetag { background-color: #2ed573; }
        .btn-adsterra { background-color: #ff4757; }
        .btn-hilltopads { background-color: #e67e22; }
        .btn-back { background-color: #747d8c; }
        .btn-save { background-color: #007bff; }

        input {
            padding: 15px;
            width: 100%;
            max-width: 300px;
            margin-bottom: 20px;
            border: 2px solid #ccc;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
            box-sizing: border-box;
        }
        
        input:focus {
            border-color: #007bff;
        }

        /* Iframe Container */
        #ad-viewer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 1000;
            display: none;
            flex-direction: column;
        }
        #ad-viewer.active {
            display: flex;
        }

        iframe {
            flex: 1;
            width: 100%;
            height: 100%;
            border: none;
            background: #fff;
        }

        /* Stop Button Styling */
        .stop-btn {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #e74c3c;
            color: white;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 30px;
            border: 2px solid white;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            z-index: 1001;
            width: auto;
            max-width: 250px;
        }
    </style>
</head>
<body>

    <div id="main-menu" class="page active">
        <h2>Auto Ad Network Menu</h2>
        <p class="info-text">Select a network. Ads will loop automatically (10s on, 1s off).</p>
        <button class="btn-monetag" onclick="handleNetwork('MoneTag')">MoneTag</button>
        <button class="btn-adsterra" onclick="handleNetwork('Adsterra')">Adsterra</button>
        <button class="btn-hilltopads" onclick="handleNetwork('HilltopAds')">HilltopAds</button>
    </div>

    <div id="setup-page" class="page">
        <h2 id="setup-title">Setup</h2>
        <p class="info-text" id="setup-desc">Paste your advertiser direct link below.</p>
        <input type="url" id="ad-input" placeholder="https://example.com/direct-link" required>
        <button class="btn-save" onclick="saveAndShowAd()">Save & Start Auto Ads</button>
        <button class="btn-back" onclick="showPage('main-menu')">Back to Menu</button>
    </div>

    <div id="ad-viewer">
        <button class="stop-btn" onclick="stopAutoAds()">🛑 Stop Auto Ads</button>
        <!-- Iframe এ সর্বোচ্চ পারমিশন (sandbox) দেওয়া হলো যাতে স্ক্রিপ্ট ব্লক না হয় -->
        <iframe id="ad-frame" sandbox="allow-scripts allow-same-origin allow-popups allow-forms" src=""></iframe>
    </div>

    <script>
        let currentNetwork = ''; 
        let isLoopRunning = false; 
        let viewTimer; 
        let restartTimer; 

        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
            document.getElementById('ad-viewer').classList.remove('active');

            if (pageId === 'ad-viewer') {
                document.getElementById('ad-viewer').classList.add('active');
            } else {
                document.getElementById(pageId).classList.add('active');
            }
        }

        function handleNetwork(networkName) {
            currentNetwork = networkName;
            const savedData = localStorage.getItem(networkName + '_link');

            if (savedData) {
                startAutoLoop(savedData);
            } else {
                document.getElementById('setup-title').innerText = networkName + " Setup";
                document.getElementById('ad-input').value = "";
                showPage('setup-page');
            }
        }

        function saveAndShowAd() {
            const inputValue = document.getElementById('ad-input').value.trim();
            
            if (inputValue === "" || !inputValue.startsWith("http")) {
                alert("Please enter a valid link starting with http:// or https://");
                return;
            }

            localStorage.setItem(currentNetwork + '_link', inputValue);
            startAutoLoop(inputValue);
        }

        function startAutoLoop(url) {
            isLoopRunning = true; 
            
            // Cache clear করার জন্য লিংকের শেষে ר্যান্ডম নাম্বার যোগ করা হলো
            const cacheBusterUrl = url + (url.includes('?') ? '&' : '?') + 'cb=' + new Date().getTime();
            
            document.getElementById('ad-frame').src = cacheBusterUrl;
            showPage('ad-viewer');

            viewTimer = setTimeout(() => {
                if (!isLoopRunning) return; 
                
                document.getElementById('ad-frame').src = "about:blank"; 
                showPage('main-menu');

                restartTimer = setTimeout(() => {
                    if (isLoopRunning) {
                        startAutoLoop(url); 
                    }
                }, 1000);

            }, 10000); // 10 seconds
        }

        function stopAutoAds() {
            isLoopRunning = false; 
            clearTimeout(viewTimer); 
            clearTimeout(restartTimer); 
            
            document.getElementById('ad-frame').src = "about:blank"; 
            showPage('main-menu'); 
        }
    </script>
</body>
</html>
