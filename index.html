<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="monetag" content="bfd805da8e1367cf9329814e51dd9754">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="referrer" content="no-referrer">
    <title>Auto Ad Viewer App</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        .page {
            display: none;
            flex: 1;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
        }
        .active {
            display: flex;
        }

        h2 {
            color: #333;
            margin-bottom: 20px;
        }
        
        p.info-text {
            color: #666;
            font-size: 14px;
            margin-bottom: 30px;
            max-width: 300px;
        }
        
        button {
            padding: 15px 30px;
            margin: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            border-radius: 10px;
            color: white;
            width: 100%;
            max-width: 300px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: 0.3s;
        }
        
        button:active {
            transform: scale(0.95);
        }

        .btn-monetag { background-color: #2ed573; }
        .btn-adsterra { background-color: #ff4757; }
        .btn-hilltopads { background-color: #e67e22; }
        .btn-back { background-color: #747d8c; }
        .btn-save { background-color: #007bff; }

        input {
            padding: 15px;
            width: 100%;
            max-width: 300px;
            margin-bottom: 20px;
            border: 2px solid #ccc;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
            box-sizing: border-box;
        }
        
        input:focus {
            border-color: #007bff;
        }

        /* --- Running Page Styling --- */
        #running-page {
            background-color: #1e272e;
            color: white;
        }

        #running-page h2 {
            color: #0be881;
        }

        .stop-btn {
            background-color: #ff3f34;
            color: white;
            padding: 15px 40px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 30px;
            border: 3px solid white;
            box-shadow: 0 5px 20px rgba(255, 63, 52, 0.4);
            margin-top: 40px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <!-- 1. Main Menu -->
    <div id="main-menu" class="page active">
        <h2>Auto Ad Network Menu</h2>
        <p class="info-text">Select a network. Ads will run normally (15s Ad ➔ Menu ➔ 1s Wait ➔ Repeat).</p>
        <button id="btn-monetag" class="btn-monetag" onclick="handleNetwork('MoneTag')">MoneTag</button>
        <button id="btn-adsterra" class="btn-adsterra" onclick="handleNetwork('Adsterra')">Adsterra</button>
        <button id="btn-hilltopads" class="btn-hilltopads" onclick="handleNetwork('HilltopAds')">HilltopAds</button>
    </div>

    <!-- 2. Setup Page -->
    <div id="setup-page" class="page">
        <h2 id="setup-title">Setup</h2>
        <p class="info-text" id="setup-desc">Paste your advertiser direct link below.</p>
        <input type="url" id="ad-input" placeholder="https://example.com/direct-link" required>
        <button class="btn-save" onclick="saveAndShowAd()">Save & Start Auto Ads</button>
        <button class="btn-back" onclick="showPage('main-menu')">Back to Menu</button>
    </div>

    <!-- 3. Running Page -->
    <div id="running-page" class="page">
        <h2>Ads are Running...</h2>
        <p class="info-text" style="color: #d2dae2;">Ad has been triggered. The bot will manage the 15-second cycle automatically.</p>
        <button class="stop-btn" onclick="stopAutoAds()">🛑 Stop Auto Ads</button>
    </div>

    <script>
        let currentNetwork = ''; 
        let isLoopRunning = false; 
        let viewTimer; 
        let restartTimer; 
        let adWindow = null; 

        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
        }

        function handleNetwork(networkName) {
            currentNetwork = networkName;
            const savedData = localStorage.getItem(networkName + '_link');

            if (savedData) {
                isLoopRunning = true;
                executeAdCycle(savedData);
            } else {
                document.getElementById('setup-title').innerText = networkName + " Setup";
                document.getElementById('ad-input').value = "";
                showPage('setup-page');
            }
        }

        function saveAndShowAd() {
            const inputValue = document.getElementById('ad-input').value.trim();
            
            if (inputValue === "" || !inputValue.startsWith("http")) {
                alert("Please enter a valid link starting with http:// or https://");
                return;
            }

            localStorage.setItem(currentNetwork + '_link', inputValue);
            isLoopRunning = true;
            executeAdCycle(inputValue);
        }

        function executeAdCycle(url) {
            if (!isLoopRunning) return; 

            // ১. বাটনে ক্লিক ইফেক্ট
            const btnId = 'btn-' + currentNetwork.toLowerCase();
            const btnElement = document.getElementById(btnId);
            if (btnElement) {
                btnElement.style.opacity = '0.5';
                setTimeout(() => { btnElement.style.opacity = '1'; }, 300);
            }

            // ২. রানিং পেজে যাওয়া এবং অ্যাড কল করা (Iframe এর বদলে window.open)
            showPage('running-page'); 
            const cacheBusterUrl = url + (url.includes('?') ? '&' : '?') + 'cb=' + new Date().getTime();
            
            // আপনার সিস্টেম অনুযায়ী এটি ট্রিগার হবে
            adWindow = window.open(cacheBusterUrl, '_blank');

            // ৩. ঠিক ১৫ সেকেন্ড অ্যাড চলবে (15000 milliseconds)
            viewTimer = setTimeout(() => {
                if (!isLoopRunning) return; 

                // ১৫ সেকেন্ড পর যদি উইন্ডো কন্ট্রোল থাকে, তবে সেটি ক্লোজ করা হবে
                if (adWindow && !adWindow.closed) {
                    adWindow.close();
                }

                // মেইন মেনুতে ফেরত আসবে
                showPage('main-menu');

                // ৪. মেইন মেনুতে ঠিক ১ সেকেন্ড (1000 milliseconds) অপেক্ষা করে আবার সাইকেল শুরু হবে
                restartTimer = setTimeout(() => {
                    if (isLoopRunning) {
                        executeAdCycle(url); // নিজে নিজেই আবার ক্লিক করে লুপ চালাবে
                    }
                }, 1000);

            }, 15000); // 15 Seconds Timer
        }

        function stopAutoAds() {
            isLoopRunning = false; 
            clearTimeout(viewTimer); 
            clearTimeout(restartTimer); 
            
            if (adWindow && !adWindow.closed) {
                adWindow.close();
            }
            
            showPage('main-menu'); 
        }
    </script>
</body>
</html>
