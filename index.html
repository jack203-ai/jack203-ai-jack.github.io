<meta name='viewport' content='width=device-width, initial-scale=1'/><!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FF Nickname Generator</title>
    <style>
        /* বেসিক স্টাইল এবং ডার্ক থিম (Free Fire Vibe) */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a2e;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 500px;
            margin: auto;
            background: #16213e;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h1 {
            color: #f9a826;
            text-transform: uppercase;
            font-size: 24px;
            margin-bottom: 20px;
        }
        input[type="text"] {
            width: 90%;
            padding: 12px;
            margin-bottom: 20px;
            border: 2px solid #0f3460;
            border-radius: 8px;
            font-size: 16px;
            background: #1a1a2e;
            color: white;
            outline: none;
        }
        input[type="text"]:focus {
            border-color: #e94560;
        }
        button.generate-btn {
            background: #e94560;
            color: white;
            border: none;
            padding: 14px 25px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            font-weight: bold;
            width: 100%;
            transition: 0.3s;
        }
        button.generate-btn:hover {
            background: #d83a50;
        }
        .ad-space {
            margin: 20px 0;
            padding: 10px;
            background: #0f3460;
            border-radius: 8px;
            color: #a9a9a9;
            font-size: 14px;
            border: 1px dashed #a9a9a9;
        }
        .result-box {
            margin-top: 20px;
            text-align: left;
        }
        .name-item {
            background: #0f3460;
            margin: 12px 0;
            padding: 15px;
            border-radius: 8px;
            font-size: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid #f9a826;
        }
        .copy-btn {
            background: #4caf50;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }
        .copy-btn:hover {
            background: #45a049;
        }
    </style>

    <!-- Start.io Web Ads Script (এখানে আপনার Start.io স্ক্রিপ্ট বসাবেন) -->
    <!-- উদাহরণ: <script src="https://start.io/your_ad_script.js"></script> -->
</head>
<body>

    <div class="container">
        <h1>FF Name Generator</h1>
        
        <input type="text" id="userName" placeholder="আপনার নাম লিখুন (যেমন: Ninja)">
        
        <button class="generate-btn" onclick="generateNames()">Generate 20 Names</button>

        <!-- Start.io Banner Ad Space -->
        <div class="ad-space" id="start-io-ad-banner">
            <!-- Start.io এর ব্যানার অ্যাডের কোড এখানে পেস্ট করুন -->
            Start.io Ad Banner
        </div>

        <div class="result-box" id="resultArea">
            <!-- জেনারেট করা নামগুলো এখানে আসবে -->
        </div>
    </div>

    <script>
        // বিভিন্ন সিম্বল এবং ফন্ট স্টাইল (১০০০+ কম্বিনেশন তৈরি করার জন্য)
        const leftSymbols = ['꧁', '☠', '★', '♛', '【', '❖', '༄', '亗', 'V', '✿', '★彡', 'ॐ'];
        const rightSymbols = ['꧂', '☠', '★', '♛', '】', '❖', '࿐', '亗', '✓', '✿', '彡★', 'ॐ'];
        const midSymbols = ['•', '×', '♡', '━', '☆', 'ッ', '᭄', 'メ', '-', '≈'];
        
        // ফন্ট রূপান্তরের জন্য ম্যাপ
        const fontStyles = {
            'a': 'α', 'b': 'ß', 'c': '¢', 'd': '∂', 'e': 'є', 'f': 'ƒ', 'g': 'g', 'h': 'н', 
            'i': 'ι', 'j': 'נ', 'k': 'к', 'l': 'ℓ', 'm': 'м', 'n': 'η', 'o': 'σ', 'p': 'ρ', 
            'q': 'q', 'r': 'я', 's': 'ѕ', 't': 'т', 'u': 'υ', 'v': 'ν', 'w': 'ω', 'x': 'χ', 
            'y': 'у', 'z': 'z'
        };

        function stylizeText(text) {
            let result = '';
            for (let char of text.toLowerCase()) {
                result += fontStyles[char] || char;
            }
            return result;
        }

        function generateNames() {
            const nameInput = document.getElementById('userName').value.trim();
            const baseName = nameInput === "" ? "Légèñd" : nameInput;
            const resultArea = document.getElementById('resultArea');
            resultArea.innerHTML = ''; // আগের রেজাল্ট ক্লিয়ার করা

            for (let i = 0; i < 20; i++) {
                // র‍্যান্ডম সিম্বল বেছে নেওয়া
                const left = leftSymbols[Math.floor(Math.random() * leftSymbols.length)];
                const right = rightSymbols[Math.floor(Math.random() * rightSymbols.length)];
                const mid = midSymbols[Math.floor(Math.random() * midSymbols.length)];

                // নামের সাথে স্টাইল অ্যাপ্লাই করা
                let isStylized = Math.random() > 0.5; // ৫০% চান্স ফন্ট চেঞ্জ হওয়ার
                let finalBaseName = isStylized ? stylizeText(baseName) : baseName;

                // নাম তৈরি করা
                let finalName = "";
                let patternType = Math.floor(Math.random() * 3);

                if (patternType === 0) {
                    finalName = `${left}${finalBaseName}${right}`;
                } else if (patternType === 1) {
                    finalName = `${left} ${finalBaseName} ${right}`;
                } else {
                    finalName = `${left}${finalBaseName}${mid}Pro${right}`;
                }

                // HTML এলিমেন্ট তৈরি করা
                const nameDiv = document.createElement('div');
                nameDiv.className = 'name-item';
                
                const nameText = document.createElement('span');
                nameText.innerText = finalName;
                
                const copyBtn = document.createElement('button');
                copyBtn.className = 'copy-btn';
                copyBtn.innerText = 'Copy';
                copyBtn.onclick = function() {
                    navigator.clipboard.writeText(finalName);
                    copyBtn.innerText = 'Copied!';
                    copyBtn.style.background = '#e94560';
                    setTimeout(() => {
                        copyBtn.innerText = 'Copy';
                        copyBtn.style.background = '#4caf50';
                    }, 1500);
                };

                nameDiv.appendChild(nameText);
                nameDiv.appendChild(copyBtn);
                resultArea.appendChild(nameDiv);
            }
        }
    </script>
</body>
</html>
